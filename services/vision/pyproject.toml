[project]
name = "dinesense-vision"
version = "0.1.0"
description = "DineSense edge vision: per-table occupancy from IP cameras, sent to the API as signed events (no video leaves the site)."
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
  "onnxruntime>=1.19,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
]

[project.scripts]
ds-vision = "dinesense_vision.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11", "jsonschema>=4.23", "types-jsonschema"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dinesense_vision"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
packages = ["dinesense_vision"]

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
